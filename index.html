
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiragana Trainer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/core/app.js"></script>
</head>

<body>
  <main class="app">
    <header>
      <h1>あ Hiragana Trainer</h1>
      <p class="subtitle">Basic exercises for learning Japanese.</p>
    </header>
    
    <section class="learning-selector" aria-labelledby="learningTitle">
      <div class="selector-heading">
        <div>
          <h2 id="learningTitle">Learning content</h2>
          <p>Select one or more groups to practise</p>
        </div>
        <button id="selectAllGroups" class="text-button" type="button">
          Select all
        </button>
      </div>

      <div id="learningCategories"></div>

      <p id="selectionSummary" class="selection-summary"
        aria-live="polite"></p>
    </section>

    <nav class="mode-selector">
      <button id="flashMode" class="primary">Flashcards</button>
      <button id="dictationMode" class="secondary">🎧 Dictation</button>
    </nav>

    <!-- FLASHCARD MODE -->
    <section id="flashPanel">

      <div class="character" id="kana">あ</div>
      <div class="answer" id="answer">?</div>

      <button class="primary" id="reveal">Reveal answer</button>

      <div id="rating" class="hidden">
        <p>Did you get it right?</p>
        <button class="success" id="correctBtn">✓ Correct</button>
        <button class="wrong" id="wrongBtn">✗ Incorrect</button>
      </div>

      <button class="secondary" id="next">Next character →</button>

      <!-- FLASHCARD STATISTICS -->
      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="total">0</strong>
          <span>Practised</span>
        </div>

        <div class="stat">
          <strong id="correct">0</strong>
          <span>Correct</span>
        </div>

        <div class="stat">
          <strong id="streak">0</strong>
          <span>Streak</span>
        </div>
      </div>

    </section>

    <!-- DICTATION MODE -->
    <section id="dictationPanel" class="hidden">
      <h2>Japanese Dictation</h2>
      <p>Listen and identify the character.</p>

      <div class="controls">

        <label for="interval">Playback speed</label>

        <div class="speed-control">
          <span>Slow</span>

          <input
            type="range"
            id="interval"
            min="0.5"
            max="5"
            step="0.5"
            value="2"
          >

          <span>Fast</span>
        </div>

        <p id="intervalValue">3.5 seconds between characters</p>

        <div class="controls">
          <button class="primary" id="toggleDictation">
            ▶ Play
          </button>

          <button class="secondary" id="repeatDictation">
            ↻ Replay
          </button>
        </div>

      </div>


      <button class="secondary" id="showDictation">Show character</button>

      <div class="dictation-answer" id="dictationAnswer"></div>
      <p id="dictationStatus" class="status">Ready to listen</p>
    </section>

  </main>
</body>
</html>
