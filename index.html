
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiragana Trainer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <main class="app">
    <header>
      <h1>あ Hiragana Trainer</h1>
      <p class="subtitle">Learn Japanese, one character at a time.</p>
    </header>

    <label for="group">Learning group</label>
    <select id="group">
      <option value="all">All hiragana</option>
      <option value="basic">V1 – Basic hiragana</option>
      <option value="dakuten">V2 – Dakuten</option>
      <option value="handakuten">V2 – Handakuten</option>
      <option value="combination">V3 – Combinations</option>
    </select>

    <nav class="mode-selector">
      <button id="flashMode" class="primary">Flashcards</button>
      <button id="dictationMode" class="secondary">🎧 Dictation</button>
    </nav>

    <!-- FLASHCARD MODE -->
    <section id="flashPanel">
      <div class="character" id="kana">あ</div>
      <div class="answer" id="answer">?</div>

      <button class="primary" id="reveal">Reveal answer</button>

      <div id="rating" class="hidden">
        <p>Did you get it right?</p>
        <button class="success" id="correctBtn">✓ Correct</button>
        <button class="wrong" id="wrongBtn">✗ Incorrect</button>
      </div>

      <button class="secondary" id="next">Next character →</button>
    </section>

    <!-- DICTATION MODE -->
    <section id="dictationPanel" class="hidden">
      <h2>Japanese Dictation</h2>
      <p>Listen and identify the character.</p>

      <label for="interval">Interval between characters</label>
      <select id="interval">
        <option value="1">1 second</option>
        <option value="2" selected>2 seconds</option>
        <option value="3">3 seconds</option>
        <option value="5">5 seconds</option>
      </select>

      <div class="controls">
        <button class="primary" id="startDictation">▶ Start</button>
        <button class="secondary" id="pauseDictation">Ⅱ Pause</button>
        <button class="secondary" id="repeatDictation">↻ Repeat</button>
      </div>

      <button class="secondary" id="showDictation">Show character</button>

      <div class="dictation-answer" id="dictationAnswer"></div>
      <p id="dictationStatus" class="status">Ready to listen</p>
    </section>

    <!-- STATISTICS -->
    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="total">0</strong>
        <span>Practised</span>
      </div>
      <div class="stat">
        <strong id="correct">0</strong>
        <span>Correct</span>
      </div>
      <div class="stat">
        <strong id="streak">0</strong>
        <span>Streak</span>
      </div>
    </div>
  </main>
</body>
</html>
